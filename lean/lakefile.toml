name = "heptagon"
defaultTargets = ["LowerBound", "LemmaA", "EndgameDefs", "EndgameData", "Endgame", "Lemma7Bridge", "CernyL2Interface", "GeometryDefs", "SegmentGeometry", "DisjointnessGraph", "EnumerationDomain", "DomainCount", "EnumerationComplete", "CounterexampleCount", "FilterSoundness", "Exclude42", "UpperBoundAssembly", "ComponentLabelling"]
# LowerBound.lean deliberately imports NOTHING (core Lean only); the Mathlib
# dependency below is used solely by LemmaA.lean.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "LowerBound"

[[lean_lib]]
name = "LemmaA"

# The endgame files (EndgameDefs / EndgameData / Endgame) deliberately import
# NOTHING outside themselves: core Lean only, like LowerBound.lean.
[[lean_lib]]
name = "EndgameDefs"

[[lean_lib]]
name = "EndgameData"

[[lean_lib]]
name = "Endgame"

# Interface/bridge lemmas.  Both import NOTHING (core Lean only).
#
# Lemma7Bridge.lean formalises ONLY the project's inference
#     nonempty status sets  +  disjoint status sets across edges  =>  H bipartite.
# AKR Lemma 7 itself is NOT assumed, axiomatised, or STATED in it (the name
# does occur in the prose comments): the
# disjointness condition is an explicit hypothesis of every theorem.
[[lean_lib]]
name = "Lemma7Bridge"

# CernyL2Interface.lean formalises ONLY the LEAN TRANSCRIPTION of the Cerny L2
# filter predicate (exact induced perfect matching).  It does NOT formalise
# Cerny Lemma 2 itself, and it is not a proof that the Python or C++ source
# implements that predicate -- there is no extraction and no cross-check.
[[lean_lib]]
name = "CernyL2Interface"

# First GEOMETRIC milestone.  GeometryDefs.lean imports NOTHING; SegmentGeometry
# imports GeometryDefs, LowerBound and EndgameDefs -- all Mathlib-free, so the
# whole geometry group stays outside Mathlib's trust base.
#
# These prove Cerny L1's project consequence (min disjointness degree) and
# Lemma A's h2 from an actual parity argument about sign alternations around a
# cycle, rather than assuming them.  Order matters: GeometryDefs first.
[[lean_lib]]
name = "GeometryDefs"

[[lean_lib]]
name = "SegmentGeometry"

# I2a: the geometry-to-endgame bridge.  Imports SegmentGeometry, so it must come
# after it.  Supplies toMasks : Config -> (Nat -> Nat), which is the ONLY thing
# Endgame.lean consumes -- every theorem there is parametric in M : Nat -> Nat.
# The spec is stated at the ORIENTATION level (DisjointO = no proper crossing);
# the point-set form in Endgame.lean's (I2) needs R^2 and is deferred as I2b.
[[lean_lib]]
name = "DisjointnessGraph"

# Obligations (1) and (2) of enumeration completeness.  Imports DisjointnessGraph
# AND Endgame (for edgeCount / isDegSeq2211111) plus Mathlib, so it must come
# last.  Part A is Mathlib-free in substance; Part B is why Mathlib is imported.
[[lean_lib]]
name = "EnumerationDomain"

# Enumeration obligation (2), CLOSED: DomainCount.lean proves
#     EnumerationDomain.domainFinset.card = 13003620
# by supplying the two steps EnumerationDomain.lean's PART B leaves open --
# that the t-th inclusion-exclusion term depends only on #t, and that for
# #t = j it is [x^9] (((1+x)^(7-j) - 1)^7).  Imports EnumerationDomain, so it
# must come last.
[[lean_lib]]
name = "DomainCount"

# Obligation (3) of enumeration completeness: the search recursion of
# python/elimination/audit_enum.py, transcribed as a Lean function, together
# with a proof by induction on the recursion depth that it VISITS every element
# of EnumerationDomain.InDomain (and, conversely, nothing else).  Imports
# EnumerationDomain, so it must come last.  Nothing here evaluates the
# 13 003 620-element output: the theorem is about the function.
[[lean_lib]]
name = "EnumerationComplete"

# The capstone joining obligations (1) and (2): a hypothetical counterexample to
# f(7,7) = 38 is one of exactly 13 003 620 mask functions.  Imports DomainCount,
# so it must come last of all.  Says NOTHING about obligations (3) and (4).
[[lean_lib]]
name = "CounterexampleCount"

# Enumeration obligation (4), STATED filter by filter and NOT closed:
# FilterSoundness.lean states, for each of the five filters of the elimination
# pipeline, the obligation "a valid configuration's mask function is not
# discarded by this filter", and proves the implication from an explicitly
# named external hypothesis (AKR Lemma 5 / AKR Lemma 7 / the order-type fact /
# Cerny Lemma 2 / correctness of the component labelling) to that conclusion.
# It proves NONE of those hypotheses, and it is not a proof of obligation (4).
# Imports DisjointnessGraph, Lemma7Bridge and CernyL2Interface -- all
# Mathlib-free -- so it must come after them.
[[lean_lib]]
name = "FilterSoundness"

# Dependency UB42: "I = 42 is impossible", the project-original argument of
# paper/proof-manifest.tex.  Exclude42.lean PROVES the combinatorial core -- 7
# edges + min degree 1 forces a perfect matching, the matching's partner
# function is injective, and the crossing-set nesting step -- and takes the
# exceptional-class invariant (|M_P| = 5, maximal crossing sets FULL \ {m}) and
# the order-type fact behind filter (c) as EXPLICIT NAMED HYPOTHESES, proving
# neither.  Imports EnumerationDomain and FilterSoundness, so it must come after
# both.
[[lean_lib]]
name = "Exclude42"

# The logical skeleton of the upper bound, with every remaining gap as a named
# hypothesis.  Imports Exclude42 (to discharge the I = 42 branch), so it must
# come after it.
[[lean_lib]]
name = "UpperBoundAssembly"

# External input (E6) of FilterSoundness.lean, DISCHARGED: a concrete component
# labelling of the 14-vertex bipartite disjointness graph, defined in Lean by a
# fuel-bounded closure iteration (no `partial`, no well-founded recursion) and
# proved equal-labels-iff-connected against Endgame.Conn, in BOTH directions.
# Section 9 applies FilterSoundness' filterA/filterB/filterE soundness theorems
# with their `hcmp` hypothesis supplied rather than assumed.  Imports
# FilterSoundness, so it must come after it.
[[lean_lib]]
name = "ComponentLabelling"
