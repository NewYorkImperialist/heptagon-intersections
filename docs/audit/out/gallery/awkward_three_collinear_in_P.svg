  <text x="35" y="52" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#444444">P0, P1, P2 are collinear (P1 sits inside the segment P0-P2), so P's base is one straight line</text>
  <text x="35" y="69" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#444444">split into two sides. SimpleClosed accepts this; general position does not. Q zig-zags across</text>
  <text x="35" y="86" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#444444">the base, twice on each side.</text>
  <text x="35" y="108" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">4 intersection points</text>
  <text x="35" y="738" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b5e9c">P (solid)</text>
